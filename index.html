<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>tudo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="titlebar">
    <div class="title-area">
      <img class="project-icon" src="assets/icon.png" alt="tudo" />
      <h1>tudo</h1>
      <span id="version-label" class="version-label" hidden></span>
      <button id="update-btn" class="update-btn" hidden></button>
    </div>
    <div id="window-controls">
      <div class="view-switch">
        <button id="view-btn" class="icon-btn" title="See due dates on a calendar"></button>
      </div>
      <div class="settings-menu">
        <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div id="settings-panel" class="settings-panel" hidden>
          <div class="settings-group">
            <div class="settings-heading">Theme</div>
            <div id="theme-options"></div>
          </div>
          <div class="settings-group" id="columns-group">
            <div class="settings-heading">Columns</div>
            <div id="columns-options"></div>
          </div>
          <div class="settings-group">
            <div class="settings-heading">Font</div>
            <div id="font-options"></div>
          </div>
        </div>
      </div>
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button id="btn-close" title="Hide">&#10005;</button>
    </div>
  </header>

  <div class="board">
    <section class="col" data-status="todo">
      <div class="col-head">
        <div class="col-title"><span class="icon-dot dot-todo"></span> To-do</div>
        <span class="count" id="count-todo">0</span>
      </div>
      <ul class="card-stack" id="list-todo" data-status="todo"></ul>
      <div class="add-issue-zone" data-status="todo">
        <button class="new-btn">+ Add issue</button>
        <form class="add-form" hidden>
          <input type="text" class="add-title" placeholder="Task title..." maxlength="200" />
        </form>
      </div>
    </section>

    <section class="col" data-status="doing">
      <div class="col-head">
        <div class="col-title"><span class="icon-dot dot-doing"></span> Doing</div>
        <span class="count" id="count-doing">0</span>
      </div>
      <ul class="card-stack" id="list-doing" data-status="doing"></ul>
      <div class="add-issue-zone" data-status="doing">
        <button class="new-btn">+ Add issue</button>
        <form class="add-form" hidden>
          <input type="text" class="add-title" placeholder="Task title..." maxlength="200" />
        </form>
      </div>
    </section>

    <section class="col" data-status="onhold">
      <div class="col-head">
        <div class="col-title"><span class="icon-dot dot-onhold"></span> On Hold</div>
        <span class="count" id="count-onhold">0</span>
      </div>
      <ul class="card-stack" id="list-onhold" data-status="onhold"></ul>
      <div class="add-issue-zone" data-status="onhold">
        <button class="new-btn">+ Add issue</button>
        <form class="add-form" hidden>
          <input type="text" class="add-title" placeholder="Task title..." maxlength="200" />
        </form>
      </div>
    </section>

    <section class="col" data-status="done">
      <div class="col-head">
        <div class="col-title"><span class="icon-dot dot-done"></span> Done</div>
        <span class="count" id="count-done">0</span>
      </div>
      <ul class="card-stack" id="list-done" data-status="done"></ul>
      <div class="add-issue-zone" data-status="done">
        <button class="new-btn">+ Add issue</button>
        <form class="add-form" hidden>
          <input type="text" class="add-title" placeholder="Task title..." maxlength="200" />
        </form>
      </div>
    </section>
  </div>

  <section class="calendar" id="calendar" hidden>
    <div class="cal-pane">
      <div class="cal-head">
        <button type="button" class="cal-nav" id="cal-prev" title="Previous month">&#8249;</button>
        <button type="button" class="cal-nav" id="cal-next" title="Next month">&#8250;</button>
        <div class="cal-month" id="cal-month"></div>
        <button type="button" class="cal-today" id="cal-today" title="Back to this month">Today</button>
      </div>
      <div class="cal-weekdays" id="cal-weekdays"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-undated" id="cal-undated" hidden></div>
    </div>

    <aside class="upcoming" id="upcoming">
      <div class="upcoming-head">
        <span class="upcoming-title">Upcoming</span>
        <span class="count" id="upcoming-count">0</span>
      </div>
      <div class="upcoming-list" id="upcoming-list"></div>
    </aside>
  </section>

  <div id="trash-zone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      <path d="M10 11v6"></path>
      <path d="M14 11v6"></path>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
    </svg>
    <span>Drop to delete</span>
  </div>

  <div id="confirm-overlay" hidden>
    <div id="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
      <p id="confirm-message">Delete this task?</p>
      <label id="confirm-skip-label">
        <input type="checkbox" id="confirm-skip" />
        Don't ask again
      </label>
      <div id="confirm-actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>
