<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <!-- Two knights resting at a campfire under the stars, for the Night Watch theme. -->
  <style>
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite alternate; }
    .flame.b { animation-duration: 0.8s; animation-delay: -0.3s; }
    .glow { animation: pulse 1.6s ease-in-out infinite alternate; }
    @keyframes flicker { from { transform: scale(0.94, 0.9); } to { transform: scale(1.04, 1.1); } }
    @keyframes pulse { from { opacity: 0.55; } to { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .flame, .glow { animation: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#e0662a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e0662a" stop-opacity="0"/>
    </radialGradient>
    <g id="knight">
      <path d="M16 96 Q10 72 26 62 Q40 56 52 68 L58 96 Z" fill="#323b4f"/>
      <path d="M52 68 L58 96" stroke="#f2a14a" stroke-width="1.4" opacity="0.8"/>
      <ellipse cx="38" cy="66" rx="11" ry="7.5" fill="#566077"/>
      <ellipse cx="34" cy="52" rx="9.5" ry="10.5" fill="#5f6b83"/>
      <path d="M43 52 Q40 40 34 41" stroke="#f2a14a" stroke-width="1.1" opacity="0.7" fill="none"/>
      <rect x="36" y="50" width="8" height="1.8" fill="#0a0e18"/>
      <path d="M30 42 Q31 36 36 39" stroke="#c8702a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="20" cy="12" r="0.9" opacity="0.8"/><circle cx="58" cy="22" r="0.7" opacity="0.6"/>
    <circle cx="96" cy="9" r="0.8" opacity="0.8"/><circle cx="130" cy="20" r="0.9" opacity="0.7"/>
    <circle cx="146" cy="8" r="0.6" opacity="0.6"/><circle cx="76" cy="30" r="0.6" opacity="0.5"/>
  </g>
  <ellipse cx="80" cy="96" rx="72" ry="5" fill="#05080f" opacity="0.7"/>
  <circle class="glow" cx="80" cy="82" r="46" fill="url(#g)"/>
  <!-- left knight, with a cloak -->
  <path d="M14 96 Q6 70 22 58 L30 63 Q18 74 22 96 Z" fill="#9b6630"/>
  <use href="#knight"/>
  <!-- right knight, facing the fire -->
  <use href="#knight" transform="translate(160 0) scale(-1 1)"/>
  <!-- the fire -->
  <rect x="64" y="90" width="30" height="4" rx="2" fill="#3a2414" transform="rotate(-8 79 92)"/>
  <rect x="66" y="91" width="30" height="4" rx="2" fill="#2a1a0e" transform="rotate(9 81 93)"/>
  <path class="flame" d="M80 91 Q68 78 75 64 Q78 73 84 69 Q82 60 89 52 Q99 72 92 91 Z" fill="#ff8a1f"/>
  <path class="flame b" d="M80 91 Q75 82 81 73 Q86 80 88 91 Z" fill="#ffd36b"/>
</svg>
